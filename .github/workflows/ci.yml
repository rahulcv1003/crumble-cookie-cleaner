name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep the pinned Playwright browser on its supported dependency image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Allow the local test server to use HTTPS port 443
        run: sudo setcap cap_net_bind_service=+ep "$(readlink -f "$(command -v node)")"
      - name: Run all checks
        run: xvfb-run -a npm test
      - name: Build release package
        run: npm run package
      - name: Capture the interface for release review
        run: |
          cp test-results/e2e-results.json test-results/release-suite-results.json
          xvfb-run -a npm run screenshots
          cp test-results/e2e-results.json test-results/screenshot-results.json
          xvfb-run -a npm run store-assets
      - name: Save release review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-review
          path: |
            docs/screenshots/
            release/*.zip
            test-results/*results.json
            store/*.png
            store/screenshots/
          retention-days: 14
